<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const WORLD = 1000, SEG = 256, HALF = WORLD / 2;
const ALT_MIN = 700, ALT_MAX = 1603, ALT_RANGE = ALT_MAX - ALT_MIN;
const VS = 0.19;
const RANGE_Y = ALT_RANGE * VS;
const BOUND = 470;

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const $ = (id) => document.getElementById(id);

function mulberry(seed) {
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry(1603);

const PERM = new Uint8Array(512);
const VAL = new Float32Array(256);
{
  const p = Array.from({ length: 256 }, (_, i) => i);
  for (let i = 255; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
  for (let i = 0; i < 256; i++) VAL[i] = rand();
}
function noise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * xf * (xf * (xf * 6 - 15) + 10), v = yf * yf * yf * (yf * (yf * 6 - 15) + 10);
  const X = xi & 255, Y = yi & 255;
  const a = VAL[PERM[PERM[X] + Y]], b = VAL[PERM[PERM[X + 1] + Y]];
  const c = VAL[PERM[PERM[X] + Y + 1]], d = VAL[PERM[PERM[X + 1] + Y + 1]];
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm(x, y, octaves) {
  let sum = 0, amp = 0.5, norm = 0;
  for (let i = 0; i < octaves; i++) { sum += amp * noise(x, y); norm += amp; x *= 2.03; y *= 2.03; amp *= 0.5; }
  return sum / norm;
}

// ---------- Terrain height ----------
const START = { x: -290, z: 290 };

const LUCNI = { x: -250, z: -300, raw: 0 };

function baseRaw(x, z) {
  const dx = x - 170, dz = z + 170, d2 = dx * dx + dz * dz;
  const peak = Math.exp(-d2 / (2 * 210 * 210)) + 0.35 * Math.exp(-d2 / (2 * 80 * 80));
  const perp = dx * 0.6 - dz * 0.8, along = dx * 0.8 + dz * 0.6;
  const ridge = Math.exp(-perp * perp / (2 * 120 * 120)) * Math.exp(-along * along / (2 * 420 * 420));
  const broad = fbm(x * 0.004 + 10, z * 0.004 + 10, 5);
  const detail = fbm(x * 0.02, z * 0.02, 3);
  const crag = 1 - Math.abs(2 * fbm(x * 0.014 + 70, z * 0.014 + 70, 3) - 1);
  let h = 0.12 + 0.62 * peak + 0.3 * ridge + 0.35 * (broad - 0.5) * (0.5 + peak) + 0.04 * (detail - 0.5) + 0.09 * crag * peak;
  const lx = x - LUCNI.x, lz = z - LUCNI.z;
  h += 0.78 * Math.exp(-(lx * lx + lz * lz) / (2 * 120 * 120)) * (0.8 + 0.4 * crag);
  return lerp(h, -0.05, smooth(400, 500, Math.max(Math.abs(x), Math.abs(z))));
}

const SUMMIT = { x: 0, z: 0, raw: -1 };
for (let x = -HALF; x <= HALF; x += 4) for (let z = -HALF; z <= HALF; z += 4) {
  const h = baseRaw(x, z);
  if (h > SUMMIT.raw) { SUMMIT.raw = h; SUMMIT.x = x; SUMMIT.z = z; }
}
for (let step = 2; step >= 0.25; step /= 2) for (let i = 0; i < 12; i++) {
  for (const [ox, oz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    const h = baseRaw(SUMMIT.x + ox * step, SUMMIT.z + oz * step);
    if (h > SUMMIT.raw) { SUMMIT.raw = h; SUMMIT.x += ox * step; SUMMIT.z += oz * step; }
  }
}
const RAW_START = baseRaw(START.x, START.z);
LUCNI.raw = baseRaw(LUCNI.x, LUCNI.z);

const TRAIL_N = 64;
function makeTrail(target, amp, waves, phase) {
  const dx = target.x - START.x, dz = target.z - START.z, len = Math.hypot(dx, dz);
  const px = -dz / len, pz = dx / len, pts = [], segLen = [], segCum = [0];
  for (let i = 0; i <= TRAIL_N; i++) {
    const t = i / TRAIL_N, w = Math.sin(t * Math.PI * waves + phase) * amp * Math.sin(t * Math.PI);
    pts.push({ x: lerp(START.x, target.x, t) + px * w, z: lerp(START.z, target.z, t) + pz * w });
  }
  for (let i = 0; i < TRAIL_N; i++) {
    segLen.push(Math.hypot(pts[i + 1].x - pts[i].x, pts[i + 1].z - pts[i].z));
    segCum.push(segCum[i] + segLen[i]);
  }
  return { target, pts, segLen, segCum, len: segCum[TRAIL_N] };
}
SUMMIT.name = 'Sněžka'; SUMMIT.loc = 'Sněžce'; SUMMIT.gen = 'Sněžky';
LUCNI.name = 'Luční hora'; LUCNI.loc = 'Luční hoře'; LUCNI.gen = 'Luční hory';
const trails = [makeTrail(SUMMIT, 70, 3, 0), makeTrail(LUCNI, 45, 2, 0.8)];

const NT = { d: 0, s: 0, trail: trails[0] };
function nearTrail(x, z) {
  let best = Infinity, bs = 0, bt = trails[0];
  for (const tr of trails) {
    const { pts, segLen, segCum, len } = tr;
    for (let i = 0; i < TRAIL_N; i++) {
      const a = pts[i], b = pts[i + 1], ex = b.x - a.x, ez = b.z - a.z;
      const t = clamp(((x - a.x) * ex + (z - a.z) * ez) / (ex * ex + ez * ez), 0, 1);
      const qx = a.x + ex * t - x, qz = a.z + ez * t - z, d = qx * qx + qz * qz;

  return NT;
}

  const { pts, segLen, segCum } = tr, target = s * tr.len;
  let i = 0;
  while (i < TRAIL_N - 1 && segCum[i + 1] < target) i++;
  const t = (target - segCum[i]) / segLen[i], a = pts[i], b = pts[i + 1];
  return { x: lerp(a.x, b.x, t), z: lerp(a.z, b.z, t), dx: (b.x - a.x) / segLen[i], dz: (b.z - a.z) / segLen[i] };
}

function rawHeight(x, z) {
  let h = baseRaw(x, z);
  nearTrail(x, z);
  h = lerp(h, lerp(RAW_START, NT.trail.target.raw, NT.s), (1 - smooth(3, 50, NT.d)) * 0.85);
  h = lerp(h, RAW_START, 1 - smooth(16, 34, Math.hypot(x - START.x, z - START.z)));
  h = lerp(h, SUMMIT.raw, 1 - smooth(10, 22, Math.hypot(x - SUMMIT.x, z - SUMMIT.z)));
  h = lerp(h, LUCNI.raw, 1 - smooth(10, 22, Math.hypot(x - LUCNI.x, z - LUCNI.z)));
  return h;
}

let RAW_MIN = Infinity;
for (let x = -HALF; x <= HALF; x += 8) for (let z = -HALF; z <= HALF; z += 8) RAW_MIN = Math.min(RAW_MIN, rawHeight(x, z));

const height = (x, z) => (rawHeight(x, z) - RAW_MIN) / (SUMMIT.raw - RAW_MIN) * RANGE_Y;
const altitudeAt = (y) => Math.min(ALT_MAX, ALT_MIN + y / VS);
const slopeAt = (x, z, y) => Math.hypot(height(x + 2, z) - y, height(x, z + 2) - y) / 2;

SUMMIT.y = height(SUMMIT.x, SUMMIT.z);
LUCNI.y = height(LUCNI.x, LUCNI.z);
SUMMIT.alt = Math.round(altitudeAt(SUMMIT.y));
LUCNI.alt = Math.round(altitudeAt(LUCNI.y));
$('lucniAlt').textContent = LUCNI.alt;
START.y = height(START.x, START.z);

const touchDevice = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
const canvas = $('c');

renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const HORIZON = new THREE.Color().setRGB(0.8, 0.89, 0.95);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(HORIZON, 260, 1700);
const camera = new THREE.PerspectiveCamera(60, 1, 0.3, 4000);

const sunDir = new THREE.Vector3(0.45, 0.65, 0.6).normalize();

const sky = new THREE.Mesh(
  new THREE.SphereGeometry(2500, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { sun: { value: sunDir } },
    vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',

scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x6b7a4a, 1.5));

sun.shadow.normalBias = 0.4;

const terrainGeo = new THREE.PlaneGeometry(WORLD, WORLD, SEG, SEG);
terrainGeo.rotateX(-Math.PI / 2);
{
  const pos = terrainGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) pos.setY(i, height(pos.getX(i), pos.getZ(i)));

const forestAt = (x, z, y) => smooth(0.55, 0.38, y / RANGE_Y) * smooth(0.38, 0.62, fbm(x * 0.008 + 40, z * 0.008 + 40, 3));

{
  const pos = terrainGeo.attributes.position, nor = terrainGeo.attributes.normal;

  const meadow = new THREE.Color(0x7fb24a), floor = new THREE.Color(0x3c6b2e), alpine = new THREE.Color(0x9aa35e);
  const rock = new THREE.Color(0x8a857d), peakRock = new THREE.Color(0xb3aea4), path = new THREE.Color(0xc8b48a);
  const c = new THREE.Color();

function updatePlayer(dt) {
  let ix = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0) + joy.x;
  let iy = (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0) + joy.y;
  let mag = Math.hypot(ix, iy);
  if (mag > 1) { ix /= mag; iy /= mag; mag = 1; }
  const run = keys.has('ShiftLeft') || keys.has('ShiftRight') || joy.mag > 0.92;

  let speed = 0, slope = 0, blocked = false;
  const gy = height(player.x, player.z);
  if (mag > 0.05) {
    const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
    let dx = fx * iy + rx * ix, dz = fz * iy + rz * ix;
    const len = Math.hypot(dx, dz);
    dx /= len; dz /= len;
    slope = (height(player.x + dx * 1.5, player.z + dz * 1.5) - gy) / 1.5;
    speed = (run ? 11 : 6) * mag;
    if (slope > 0) speed *= clamp(1 - slope / 1.2, 0.2, 1);
    else speed *= 1 + clamp(-slope, 0, 0.5) * 0.4;
    if (slope > 0.85) { blocked = true; speed = 0; showToast(); }
    player.x = clamp(player.x + dx * speed * dt, -BOUND, BOUND);
    player.z = clamp(player.z + dz * speed * dt, -BOUND, BOUND);
    let da = Math.atan2(dx, dz) - player.face;
    da = Math.atan2(Math.sin(da), Math.cos(da));
    player.face += da * (1 - Math.exp(-12 * dt));
  }

  for (const c of colliders) {
    const ox = player.x - c.x, oz = player.z - c.z, d = Math.hypot(ox, oz), min = c.r + 0.4;
    if (d < min && d > 0.001) { player.x = c.x + ox / d * min; player.z = c.z + oz / d * min; }
  }

  const ground = height(player.x, player.z);
  if (jumpQueued && player.grounded) { player.vy = 8; player.grounded = false; }
  jumpQueued = false;
  if (player.grounded && ground < player.y - 0.6) player.grounded = false;
  if (player.grounded) player.y = ground;
  else {
    player.vy -= 24 * dt;
    player.y += player.vy * dt;
    if (player.y <= ground) { player.y = ground; player.vy = 0; player.grounded = true; }
  }

  anim.speed = speed;
  const climbing = player.grounded && !blocked && mag > 0.05 && slope > 0.42;
  anim.climb = lerp(anim.climb, climbing ? 1 : 0, 1 - Math.exp(-8 * dt));
  anim.amp = lerp(anim.amp, clamp(speed / 6, 0, 1.3), 1 - Math.exp(-10 * dt));
  anim.phase += speed * dt * (climbing ? 2.2 : 1.9);
}

function poseHiker(t) {
  const s = Math.sin(anim.phase), air = player.grounded ? 0 : 1;
  const swing = anim.amp * 0.75;
  legL.rotation.x = lerp(s * swing, 0.5, air);
  legR.rotation.x = lerp(-s * swing, -0.3, air);
  const armWalkL = -s * swing, armWalkR = s * swing;
  const armClimbL = -2.5 + s * 0.35, armClimbR = -2.5 - s * 0.35;
  armL.rotation.x = lerp(armWalkL, armClimbL, anim.climb);
  armR.rotation.x = lerp(armWalkR, armClimbR, anim.climb);
  armL.rotation.x = lerp(armL.rotation.x, -1.2, air);
  armR.rotation.x = lerp(armR.rotation.x, -1.2, air);
  body.rotation.x = anim.climb * 0.3 + Math.min(anim.amp, 1) * 0.06;
  body.position.y = Math.abs(Math.sin(anim.phase)) * 0.06 * anim.amp * (1 - air);
  hiker.position.set(player.x, player.y, player.z);
  hiker.rotation.y = player.face;
}

const camTarget = new THREE.Vector3(player.x, player.y + 1.5, player.z);
let camDistNow = camDist;
const camOff = new THREE.Vector3();
function updateCamera(dt) {
  if (state.mode === 'menu') { yaw += dt * 0.08; camDist = 22; }
  camTarget.lerp(new THREE.Vector3(player.x, player.y + 1.5, player.z), 1 - Math.exp(-10 * dt));
  camOff.set(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch));
  let k = 1;
  while (k > 0.2) {
    const ok = [k, k * 0.6, k * 0.3].every((f) => {
      const px = camTarget.x + camOff.x * camDist * f, pz = camTarget.z + camOff.z * camDist * f;
      return camTarget.y + camOff.y * camDist * f > height(px, pz) + 0.8;
    });
    if (ok) break;
    k -= 0.1;
  }
  camDistNow = k < 1 ? Math.min(camDistNow, camDist * k) : lerp(camDistNow, camDist, 1 - Math.exp(-4 * dt));
  camera.position.copy(camTarget).addScaledVector(camOff, camDistNow);
  camera.position.y = Math.max(camera.position.y, height(camera.position.x, camera.position.z) + 1.2);
  camera.lookAt(camTarget);
  sky.position.copy(camera.position);
}

let lastAlt = '', lastDist = '', lastTime = '';
function updateHud() {
  const alt = fmtInt(altitudeAt(player.y)) + ' m n. m.';
  if (alt !== lastAlt) { $('altv').textContent = alt; lastAlt = alt; }
  const dx = goal.x - player.x, dz = goal.z - player.z, dist = Math.hypot(dx, dz);
  const d = dist >= 1000 ? (dist / 1000).toFixed(2).replace('.', ',') + ' km' : fmtInt(dist) + ' m';
  if (d !== lastDist) { $('distv').textContent = d; lastDist = d; }
  const t = fmtTime(state.time);
  if (t !== lastTime) { $('timev').textContent = t; lastTime = t; }
  const rel = Math.atan2(dx, dz) - Math.atan2(-Math.sin(yaw), -Math.cos(yaw));
  $('arrow').setAttribute('transform', `rotate(${(-rel * 180 / Math.PI).toFixed(1)})`);
  return dist;
}

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), now = clock.elapsedTime;
  if (state.mode === 'play') {
    updatePlayer(dt);
    state.time += dt;
    const dist = updateHud();
    if (!state.reached && dist < 9) {
      state.reached = true;
      $('winTime').textContent = fmtTime(state.time);
      $('winTitle').textContent = `Jsi na ${goal.loc}!`;
      $('winAlt').textContent = `${fmtInt(goal.alt)} m n. m.`;
      $('other').textContent = `Zkusit ${goal === SUMMIT ? LUCNI.name : SUMMIT.name}`;
      $('win').hidden = false;
    }
    if (state.toast > 0 && (state.toast -= dt) <= 0) $('toast').classList.remove('on');
  }
  poseHiker(now);
  updateCamera(dt);
  for (const c of clouds) {
    c.position.x += c.userData.speed * dt;
    if (c.position.x > 1100) c.position.x = -1100;
  }
  for (const f of flags) f.rotation.y = Math.sin(now * 3) * 0.25;
  sun.position.set(player.x, player.y, player.z).addScaledVector(sunDir, 150);
  sun.target.position.set(player.x, player.y, player.z);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
